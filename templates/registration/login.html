{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<h1>Авторизация</h1>

<form method="post">
    {% csrf_token %}
    
    <div class="form-group">
        <label for="id_username">Логин</label>
        <input type="text" name="username" id="id_username" required placeholder="Введите ваш логин">
    </div>
    
    <div class="form-group">
        <label for="id_password">Пароль</label>
        <input type="password" name="password" id="id_password" required placeholder="Введите пароль">
    </div>
    
    <button type="submit">Войти</button>
</form>

<p style="margin-top: 20px; text-align: center;">
    Ещё не зарегистрированы? <a href="{% url 'register' %}">Регистрация</a>
</p>
{% endblock %}
